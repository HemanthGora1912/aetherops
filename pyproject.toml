[project]
name = "aetherops"
version = "0.2.0"
description = "Distributed database node provisioner and self-healing controller"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "mypy>=1.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
